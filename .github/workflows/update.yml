name: Update costlike cask

on:
  schedule:
    # Daily at ~06:17 UTC, the same time as the Chocolatey package.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'CostLike version to pin (e.g. "v0.10.0" or "0.10.0"). Leave blank to use the latest release on costlike.com.'
        required: false
        default: ''
      force:
        description: 'Re-verify, re-test and re-tag even if the cask already points at that version.'
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - 'Casks/**'
      - 'scripts/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: update-costlike-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      version: ${{ steps.changes.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Point the cask at the release
        if: github.event_name != 'pull_request'
        env:
          COSTLIKE_VERSION: ${{ github.event.inputs.version }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: bash scripts/update.sh

      - name: Detect changes
        id: changes
        run: |
          changed=false
          if [ -n "$(git status --porcelain)" ] || [ "${{ github.event.inputs.force }}" = "true" ]; then changed=true; fi
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/costlike.rb)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cask version:         $version"
          echo "Working tree changed: $changed"

      - uses: actions/upload-artifact@v4
        with:
          name: cask
          path: Casks/costlike.rb

  # brew style, brew audit and a real install, on macOS, before anything is committed:
  # a cask that cannot install never reaches the tap.
  check:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name == 'pull_request'
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      TAP: cloudcertainty/costlike-ci
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cask

      - name: Stage the cask in a scratch tap
        run: |
          brew tap-new --no-git "$TAP"
          mkdir -p "$(brew --repo "$TAP")/Casks"
          cp costlike.rb "$(brew --repo "$TAP")/Casks/costlike.rb"

      - name: brew style
        run: brew style --cask "$TAP/costlike"

      - name: brew audit
        run: brew audit --cask --strict --online "$TAP/costlike"

      - name: Install, check the version, uninstall
        run: |
          brew install --cask "$TAP/costlike"
          want=$(sed -n 's/^  version "\(.*\)"$/\1/p' costlike.rb)
          got=$(defaults read /Applications/CostLike.app/Contents/Info.plist CFBundleShortVersionString)
          echo "Installed CostLike $got (cask says $want)"
          if [ "$got" != "$want" ]; then
            echo "::error::The disk image for $want contains CostLike $got"
            exit 1
          fi
          brew uninstall --cask --zap "$TAP/costlike"
          test ! -e /Applications/CostLike.app

  publish:
    needs: [update, check]
    if: github.event_name != 'pull_request' && needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: cask
          path: Casks

      - name: Commit and tag
        run: |
          version="${{ needs.update.outputs.version }}"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ -n "$(git status --porcelain)" ]; then
            git add Casks/costlike.rb
            git commit -m "costlike: bump to $version"
            git push
          fi

          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists on origin, skipping."
          else
            git tag -a "$tag" -m "costlike $tag"
            git push origin "$tag"
          fi
